<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc"><title id="title">Script source and attachments share a stable Asset ID</title><desc id="desc">The editor registers user-owned script source with a stable asset ID. Attachments reference that ID. Source renames preserve identity. Validated source enters Play.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#9a4b26"/></marker></defs>
<rect width="1120" height="500" fill="#faf7f1"/>
<text x="32" y="38" font-family="sans-serif" font-size="24" font-weight="700" fill="#26221e">Script source and attachments share a stable Asset ID</text>
<path d="M292 135 L430 135" stroke="#9a4b26" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="361.0" y="125.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#713a23">Registers</text>
<path d="M690 135 L828 135" stroke="#9a4b26" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="759.0" y="125.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#713a23">Attach by ID</text>
<path d="M162 175 L162 310" stroke="#9a4b26" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="196" y="232.5" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#713a23">Edit</text>
<path d="M292 350 L430 350" stroke="#9a4b26" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="361.0" y="340.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#713a23">Save</text>
<path d="M690 350 L828 350" stroke="#9a4b26" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="759.0" y="340.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#713a23">Accepted</text>
<path d="M958 175 L958 310" stroke="#9a4b26" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="996" y="232.5" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#713a23">Scope</text>
<rect x="32" y="95" width="260" height="80" rx="8" fill="#fff" stroke="#aa9c89"/>
<text x="162.0" y="125" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="600" fill="#26221e">Source file</text>
<text x="162.0" y="150" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#62574b">User-owned scripts/ or ui/</text>
<rect x="430" y="95" width="260" height="80" rx="8" fill="#fff" stroke="#aa9c89"/>
<text x="560.0" y="125" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="600" fill="#26221e">Asset registry</text>
<text x="560.0" y="150" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#62574b">Editor-owned config/scripts.ron</text>
<rect x="828" y="95" width="260" height="80" rx="8" fill="#fff" stroke="#aa9c89"/>
<text x="958.0" y="125" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="600" fill="#26221e">Attachment</text>
<text x="958.0" y="150" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#62574b">References a stable Asset ID</text>
<rect x="32" y="310" width="260" height="80" rx="8" fill="#fff" stroke="#aa9c89"/>
<text x="162.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="600" fill="#26221e">External editor</text>
<text x="162.0" y="365" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#62574b">Edit and save source</text>
<rect x="430" y="310" width="260" height="80" rx="8" fill="#fff" stroke="#aa9c89"/>
<text x="560.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="600" fill="#26221e">Validate source</text>
<text x="560.0" y="365" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#62574b">Before snapshot or reload</text>
<rect x="828" y="310" width="260" height="80" rx="8" fill="#fff" stroke="#aa9c89"/>
<text x="958.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="600" fill="#26221e">Play instance</text>
<text x="958.0" y="365" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#62574b">Game / scene / object lifetime</text>
<text x="32" y="447" font-family="sans-serif" font-size="15" fill="#62574b">Editor moves and renames preserve identity. Do not hand-edit the registry.</text>
<text x="32" y="471" font-family="sans-serif" font-size="15" fill="#62574b">Rejected reload keeps the prior instance; property-schema changes require Restart Play.</text>
</svg>