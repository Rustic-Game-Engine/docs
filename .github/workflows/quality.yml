name: Documentation site quality

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Website lint, types, build, and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint -- --max-warnings=0
      - name: Install optional syntax tools
        run: sudo apt-get update && sudo apt-get install -y lua5.4 php-cli
      - run: npm run check:syntax
      - run: npm run check:engine-drift
      - run: npm run check:api-examples
      - run: npm run build
        if: ${{ !cancelled() }}
      - run: npm test
        if: ${{ !cancelled() }}
      - run: npx tsc --noEmit
        if: ${{ !cancelled() }}
      - run: npm audit --audit-level=moderate
        if: ${{ !cancelled() }}
      - run: npm run check:docs
        if: ${{ !cancelled() }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        if: ${{ !cancelled() }}
      - name: Preserve browser diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 7
